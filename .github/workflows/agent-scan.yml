name: Agent system scan

# Keeps the JARVIS agent layer fresh without anyone pressing "סריקת מערכת".
# Calls the CRON_SECRET-gated aggregator endpoint which runs all 11 department
# scanners. Every 5 minutes (GitHub's minimum). Manual run via workflow_dispatch.
#
# Requires repo secret CRON_SECRET to match the Vercel production CRON_SECRET.
# If the secret is missing the job no-ops with a clear message (never fails noisily).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger aggregated agent scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCAN_URL: https://eliozelk.vercel.app/api/agents/cron-scan
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET secret not set — skipping scan. Add it with: gh secret set CRON_SECRET"
            exit 0
          fi
          code=$(curl -sS -o /tmp/scan.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SCAN_URL}")
          echo "HTTP ${code}"
          head -c 2000 /tmp/scan.json || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Agent scan returned HTTP ${code}"
            exit 1
          fi
